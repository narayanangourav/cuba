apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: cuba
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/narayanangourav/cuba.git
    targetRevision: tooling
    path: deploy/helm/cuba

  destination:
    server: https://kubernetes.default.svc
    namespace: cuba

  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
      allowEmpty: false

    syncOptions:
      - CreateNamespace=true
      - PruneLast=true

    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
